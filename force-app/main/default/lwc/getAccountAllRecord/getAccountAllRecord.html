<template>
    <lightning-card title="Display All Records Of Account" custom-icon="custom:icon13">
        <div class="slds slds-p-horizontal--medium">
         <div class="slds-grid slds-wrap">
            <div class="slds-col slds-size_4-of-12 slds-m-bottom--medium">
                <lightning-Input type="search" placeholder="Search..." value={accountName} name="accountName" class="accountName" onchange={handleChangeAccName}></lightning-input>                 
             </div>
             <div class="slds-col slds-size_6-of-12 slds-m-top--medium" style="margin-top: 19px; margin-left: 10px;">                 
                    <lightning-button label="Search Account Name" size="small" variant="brand" onclick={handleAccountSearch} icon-name="utility:search" icon-position="right"></lightning-button>
             </div>
         </div>
          
         <h2>Account Name :- <span><strong>{currentAccountName}</strong></span></h2><br/> 
         <h3><strong><span style="color:brown;">{dataNotFound}</span></strong></h3><br/>
 
           <h2 class="slds-m-bottom--x-small" style="color:rgb(121, 105, 226); font-weight:bold;">Displaying Contacts Records based on Account Name</h2>
           <table class="slds-table slds-table_cell-buffer slds-table_bordered" border="1" cellspacing="0" cellpadding="0"  style="border-collapse:collapse;">
               <thead>
                   <tr>
                       <th>Contacts</th>
                       <th>Opportunities</th>
                       <th>Case</th>
                       <th>Files</th>
                       <th>Notes & Attachments</th>
                   </tr>
               </thead>
               <tbody>
                   <template for:each={records} for:item="AccItem">
                       <tr key={conItem.Id}>
                           <td>{Acctem.Contacts}</td>
                           <td>{Acctem.Opportunities}</td>
                           <td>{Acctem.Case}</td>
                           <td>{Acctem.Files}</td>
                           <td>{Acctem.Notes}</td>
                       </tr>
                   </template>
               </tbody>
           </table>
        </div>
 
<br/><br/>
 
    </lightning-card>
</template>
