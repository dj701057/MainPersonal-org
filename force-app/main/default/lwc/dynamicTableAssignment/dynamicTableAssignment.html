<template>
    <lightning-card  variant="Narrow"  title="Global Quarry Results Of Records" icon-name="standard:record">
        <lightning-button variant="brand"  label="Get Record" slot="actions" onclick={showModal}></lightning-button>
        
        <template if:true={openModal}>  
            <div class="slds-modal slds-fade-in-open slds-backdrop">  
              <div class="slds-modal__container">  
                <!------HEADER Section-->  
                <div class="slds-modal__header">  
                  <lightning-button-icon icon-name="utility:close" alternative-text="Close this window" size="large"  
                    variant="bare-inverse" onclick={closeModal} class="slds-modal__close">  
                  </lightning-button-icon>  
                  <h1>Welcome To Global Quarry Results Of Records</h1>  
                </div>  
                <!------Body Section-->  
                <lightning-card title="Select the Object To Explore More" icon-name="custom:custom67">
                    <template if:true={profileOptionsList}>
                        <div class="slds-m-around_medium">
                                <select onchange={handleProfileChange} data-id="selectId" class="slds-select selectProfileList" name="selectuser">
                                    <option value="">--None--</option>
                                    <template for:each={profileOptionsList} for:item="item">
                                        <option value={item.value} key={item.value}>{item.label}</option>
                                    </template>
                                  </select>               
                        </div>
                      </template>
                  </lightning-card>

                <!------Footer Section-->  
                <div class="slds-modal__footer">  
                  <lightning-button  label="Get Record" variant="brand" onclick={handleGetProfiles}>  
                    
                  </lightning-button>
                </div>  
              </div>  
            </div>  
          </template>  
    </lightning-card>
</template>
