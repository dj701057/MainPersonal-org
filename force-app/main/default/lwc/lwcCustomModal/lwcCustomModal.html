<template>
    
    <lightning-card title="Files" icon-name="utility:file">
    
    <!-- lightning button for open custom modal window -->
<!--
    <lightning-button variant="brand"
    label="Add Files" 
    title="Open Modal"
    onclick={customShowModalPopup}
    class="slds-float_Right" ></lightning-button>

     -->
    
    <div class="slds-clearfix">
        <div class="slds-float_right">
            <lightning-button label="Add Files"
            variant="brand"
            title="Open Model"
            onclick={customShowModalPopup}
            class="slds-m-left_x-small"></lightning-button>
        </div>
    </div>

    
    
    <!-- modal start -->        
    <template if:true={customFormModal}>
    
    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
    <div class="slds-modal__container">
        <!-- modal header start -->
        <header class="slds-modal__header">
            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={customHideModalPopup}>
                <lightning-icon icon-name="utility:close"
                alternative-text="close"
                variant="inverse"
                size="small" ></lightning-icon>
                <span class="slds-assistive-text">Close</span>
            </button>
            <h2 class="slds-text-heading_medium slds-hyphenate">Select Files</h2>
        </header>
        <!-- modal body start -->
        <div class="slds-modal__content slds-p-around_medium">
            <div class="c-container">
                <lightning-layout multiple-rows="true">
                    <lightning-layout-item padding="around-small" size="12">
                        <lightning-layout>
                            <lightning-layout-item padding="around-small" size="5">
                                <div class="page-section page-right">

                                   
                                       
                                            <div>
                                                <lightning-input label="" name="file uploader" onchange={handleFilesChange} type="file" multiple></lightning-input>
                                            </div><br/>
                                            <div class="slds-text-body_small slds-text-color_error">{fileName}
                                            <template if:true={showLoadingSpinner}>
                                                    <lightning-spinner alternative-text="Uploading......" size="medium"></lightning-spinner>
                                                </template>
                                            </div><br/>
                                            <div>
                                                <lightning-button class="slds-m-top--medium" label={UploadFile} onclick={handleSave} variant="brand" disabled={isTrue}></lightning-button>
                                            </div>
                                            
                                            

                                    <lightning-layout-item size = "2">
                                            <span>
                                                <ul>
                                                    <li><a onclick={handleOptionClick}>Owned by Me</a></li><br/>
                                                    <li><a onclick={handleOptionClick}>Shared with Me</a></li><br/>
                                                    <li><a onclick={handleOptionClick}>Recent</a></li><br/>
                                                    <li><a onclick={handleOptionClick}>Following</a></li><br/>
                                                    <li><a onclick={handleOptionClick}>Libraries</a></li><br/>
                                                    <li><a onclick={handleOptionClick}>Recent Files</a></li><br/>
                                                </ul>
                                            </span>  
                                    </lightning-layout-item>

                                </div>
                            </lightning-layout-item>

                            <lightning-layout-item padding="around-small" size="7" class="search">
                                <div class="page-section page-main">
                                    <lightning-input id="search-01" type="search" onchange={handleSearch}></lightning-input>
                                    
                                     <!-- Datatable to show the related files of the record -->
                                        <lightning-card title="Related Files of the record" icon-name="standard:account">
                                            <div style="width: auto;">
                                                <template if:true={FileTableList}>
                                                        <lightning-datatable
                                                                data={FileTableList}
                                                                columns={columns}
                                                                key-field="id"
                                                                onrowselection={getSelectedRecords}>
                                                        </lightning-datatable>
                                                </template>
                                            </div>
                                        </lightning-card>
    
                         
                                </div>
                            </lightning-layout-item>
                        </lightning-layout>
                    </lightning-layout-item>
                </lightning-layout>
            </div>
            

           
   
    <!-- modal footer start-->
        <footer class="slds-modal__footer">
            <span class="infoMsg slds-text-body--small slds-float--left slds-p-top--x-small header" role="status" data-aura-rendered-by="1693:0">0 of 10 files selected</span>
            <button class="slds-button slds-button--destructive" onclick={customHideModalPopup}>Cancel</button>
            <button class="slds-button slds-button_brand">Save</button>
        </footer>
    </div>
    </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open">
    </div>
    </template>
    <!-- modal end --> 

    
    </lightning-card>  
    </template>
